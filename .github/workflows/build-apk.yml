name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_DIR: apps/web   # folder containing the web app's package.json
  WEB_DIR: dist       # its build output folder

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build web app
        run: |
          pnpm install
          pnpm --dir $APP_DIR run build

      - name: Add Capacitor and Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          pnpm add @capacitor/core @capacitor/android
          pnpm add -D @capacitor/cli
          [ -f capacitor.config.json ] || [ -f capacitor.config.ts ] || \
            npx cap init "Code Design" com.lightalter.codedesign --web-dir=$WEB_DIR
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
