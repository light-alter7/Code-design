name: Loomdesign Android APK

on:
  push:
    branches:
      - main
      - feat/loomdesign-android-release
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p apps/android-native assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loomdesign-debug-apk
          path: apps/android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: gradle -p apps/android-native assembleRelease

      - name: Publish tagged APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android-native/app/build/outputs/apk/release/app-release.apk
