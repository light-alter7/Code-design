name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WEB_DIR: dist   # change to build, or . for plain HTML

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build web app
        run: |
          npm install
          npm run build --if-present

      - name: Add Capacitor and Android
        run: |
          npm install @capacitor/core @capacitor
